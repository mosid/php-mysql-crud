name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build & Push to ECR"]
    types: [completed]
    branches: [main, master]

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest commit SHA)'
        required: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: php-crud-cluster
  K8S_NAMESPACE: php-crud
  ECR_REPOSITORY: php-mysql-crud

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Determine image tag
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=$ECR_REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      - name: Create namespace if not exists
        run: kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        env:
          IMAGE: ${{ steps.image.outputs.full_image }}
        run: |
          # Substitute the image in the deployment manifest and apply all manifests
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml | kubectl apply -n $K8S_NAMESPACE -f -
          kubectl apply -n $K8S_NAMESPACE -f k8s/service.yaml
          kubectl apply -n $K8S_NAMESPACE -f k8s/configmap.yaml
          kubectl apply -n $K8S_NAMESPACE -f k8s/secret.yaml
          kubectl apply -n $K8S_NAMESPACE -f k8s/ingress.yaml
          kubectl apply -n $K8S_NAMESPACE -f k8s/hpa.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/php-crud -n $K8S_NAMESPACE --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment php-crud -n $K8S_NAMESPACE
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n $K8S_NAMESPACE -l app=php-crud
          echo ""
          echo "=== Service ==="
          kubectl get svc php-crud -n $K8S_NAMESPACE
